<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- Still nothing from the network. The additions are all `self` or inline
     data: the editor's runtime sits beside this file, it spawns a worker from
     that same directory, and it draws its icons from a font it ships. `blob:`
     is there because the AMD loader hands the worker its bootstrap that way
     when the page is on file://. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' blob:;
               worker-src 'self' blob:; child-src 'self' blob:;
               font-src 'self'; img-src 'self' data:;">
<title>cian — Comfortable Interface for Agile file explorer Navigation</title>
<style>
/* The look is the whole reason this build exists, so the type comes first.
   The face is bundled (vendor/fonts, via `node gui/vendor.js`) — nothing from
   the network, same as ever; it ships beside the app the way the window
   build's font does. Chromium still draws it with DirectWrite on Windows,
   which is the whole point of this front end. */
:root {
  /* 白磁 — the default.
     Colour where it means something and nowhere else: a directory, a mark,
     the cursor. Everything else is spacing and a hairline. Rows are open
     enough to be read by somebody who does not live in a file manager, which
     is who this build is for. */
  --bg:        #f7f8f8;
  --pane:      #ffffff;
  --pane-off:  #f3f5f5;
  --line:      #e3e7e6;
  --text:      #2b3333;
  --dim:       #8b9493;
  --dir:       #17706a;
  --accent:    #0e9e8f;
  --accent-dim:#e6f1ef;
  --on-accent: #ffffff;
  /* The selected row in the pane that has the keys, and the row under the
     pointer. Both are grounds rather than fills — a saturated bar across a
     row is the loudest thing on a light screen and says no more than a tint
     does. */
  --sel-strong:#c8e4df;
  --row-hover: #eef2f1;
  --mark:      #bf6b34;
  /* What kind of file a name is, said in its colour — the terminal build's
     FilePalette (theme.rs), quietened for 白磁's ground. Directory is --dir,
     dotfiles are --dim; these seven cover the rest. */
  --k-code:    #7a6a2f;
  --k-config:  #2f6f74;
  --k-doc:     #4a5a8a;
  --k-image:   #8a4a7a;
  --k-media:   #2f6f74;
  --k-archive: #9a4a3a;
  --k-exec:    #3a7a4a;
  /* What mode the keys are in, in the colours cian-tui uses for exactly this
     (render.rs `focus_badge_color`). Copied value for value rather than
     chosen again: a person who knows that green means "searching" in one
     build must not have to learn a second vocabulary for the other.
     Not themed — they say *which mode*, and a mode that changed colour with
     the palette would be a fact you had to re-learn per theme. */
  --m-visual:  rgb(255, 140, 0);
  --m-search:  rgb(80, 200, 120);
  --m-command: rgb(200, 100, 200);
  /* A pane showing somebody else's server. cian-tui's CRMAINE, and the one
     confusion worth spending a colour on. */
  --m-remote:  rgb(214, 45, 70);
  /* **cian's own cyan, and it never moves.** The colour of the icon's bright
     stop (`packaging/icon.py` G1) — the two colours he said he liked the look
     of. The frame round the surface holding the keys wears this in the
     ordinary mode, and wears it in every palette.
     2026-09-06: 「どんなテーマでも同じ枠色にしてほしい。シアンっぽい色に
     なっていたはずだ。今はテーマにあわせて色が変わっているが固定がいい」。
     It used to be `--accent`, which is the palette's, so the frame was a
     different colour in each of the eighteen — and the one thing the frame
     says (**this side has the keys**) is the same sentence in all of them.
     The four mode colours beside it were already fixed for exactly that
     reason; this was the odd one out. */
  --cian:      rgb(22, 203, 225);
  /* What kind of news a message carries — cian-tui's `message_color`, again
     value for value. A failure must never wear a success's clothes. */
  --msg-good:  rgb(110, 200, 130);
  --msg-warn:  rgb(235, 200, 100);
  --msg-bad:   rgb(235, 110, 110);
  /* The veil behind a dialog. A hardcoded near-black sat over 白磁 and
     github-light alike; now the dark looks and palettes deepen it below. */
  --scrim:     rgba(23, 26, 31, .45);
  --bad-bg:    #5a2233;
  --bad-fg:    #ffd7de;
  --cell-h:    22px;
  /* The two fixed bars at the foot. Measured at runtime rather than declared:
     the text in them is set at a size the person can change, so a number
     written here would be right until the first Ctrl+= and wrong after. */
  --status-h:  20px;
  --hints-h:   0px;
  --size:      15px;
  /* What `cian.font{ face = "…" }` asked for, ahead of everything else.
     Defaults to the bundled face, so a config that says nothing gets exactly
     what it got before this existed — and a config that names one is only
     moving the front of the queue, never emptying it: every fallback below
     is still there for the characters the chosen face has no glyph for. */
  --user-face: "cian gothic";
  /* The face the listing and the code use. Named so the preview can borrow
     it for code while setting prose in something proportional. */
  --mono: var(--user-face), "cian gothic", "HackGen Console NF",
          "HackGen35 Console NF", Menlo,
          Consolas, "BIZ UDGothic", ui-monospace, monospace;
  /* The bundled face first — HackGen Console NF, carried in gui/vendor/fonts
     the way the window build carries the same file. Hoping HackGen was
     installed put the listing in Hiragino (proportional) and drew the shell
     prompt as tofu on most Macs. After the bundled and installed Nerd faces,
     the fallbacks are *monospaced* — this is a grid program, and columns cut
     in a proportional face never line up — ending on `monospace` rather than
     nothing, so a miss lands on a gothic grid and never on 明朝. */
  --face: var(--user-face), "cian gothic", "HackGen Console NF",
          "HackGen35 Console NF",
          "UDEV Gothic NF", "Cica", Menlo, "Osaka-Mono", "MS Gothic",
          "BIZ UDGothic", ui-monospace, monospace;
}

/* The bundled font. When gui/vendor/fonts is absent (a checkout that has not
   run `node gui/vendor.js`), this fails quietly and the stack above walks on. */
@font-face {
  font-family: "cian gothic";
  src: url("vendor/fonts/cian.ttf") format("truetype");
  font-display: swap;
}

/* 陰翳 — dark kept dark, and only what matters catches the light.
   The ground is not black but a deep brown; one gold and one vermilion. */
:root[data-look="inei"] {
  --bg:        #14110f;
  --pane:      #1c1714;
  --pane-off:  #161211;
  --line:      #2b2320;
  --text:      #d9d0c5;
  --dim:       #7c6f64;
  --dir:       #c9a227;
  --accent:    #e8b84b;
  --accent-dim:#2e2519;
  --on-accent: #1a1409;
  --sel-strong:#3d3120;
  --row-hover: #241d19;
  --mark:      #c8703c;
  --k-code:    #d0b05a;
  --k-config:  #8fb8a8;
  --k-doc:     #a8b8d0;
  --k-image:   #c08ab0;
  --k-media:   #8fb8a8;
  --k-archive: #d08a6a;
  --k-exec:    #9ac07a;
}

/* 端末譲り — the terminal build, not disowned.
   Monospace throughout, rows tight, ANSI bright colours as they are. */
:root[data-look="terminal"] {
  --bg:        #0c0c0c;
  --pane:      #111111;
  --pane-off:  #0d0d0d;
  --line:      #232323;
  --text:      #c8c8c8;
  --dim:       #6a6a6a;
  --dir:       #5fafff;
  --accent:    #5fffd7;
  --accent-dim:#1c2a28;
  --on-accent: #04120f;
  --sel-strong:#263a37;
  --row-hover: #1a1a1a;
  --mark:      #ffd75f;
  --k-code:    #d7af5f;
  --k-config:  #5fd7d7;
  --k-doc:     #87afd7;
  --k-image:   #d787d7;
  --k-media:   #5fd7d7;
  --k-archive: #ff8787;
  --k-exec:    #87d787;
  --cell-h:    19px;
  --size:      14px;
  --face: "cian gothic", "HackGen Console NF", "UDEV Gothic NF", "Cica",
          ui-monospace, "Consolas", monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--text);
  /* Written out rather than as the `font` shorthand. The shorthand takes a
     size and a family together, and one unparseable piece throws away the
     whole declaration — which lands on the browser default, and on Japanese
     Windows that default is 明朝. Three properties fail one at a time. */
  font-family: var(--face);
  font-size: var(--size);
  line-height: var(--cell-h);
  /* A file manager is not a document: nothing here should be draggable text. */
  user-select: none; cursor: default;
  overflow: hidden;
}
/* The two splits, as percentages, the way the terminal build holds them:
   `--main-pct` is the height given to the *files* (so the shell gets the
   rest) and `--panes-pct` the width given to the left pane. Ctrl+Shift+arrow
   moves them, and they are remembered. The shell was a hardcoded 40%, which
   on an 800px window left thirteen rows for a listing and three hundred
   pixels of empty terminal. */
:root { --main-pct: 75%; --panes-pct: 50%; }
/* One hairline down the middle and nothing else. The listing is the window;
   every pixel spent on a frame around it is a row not shown. */
#panes { flex: 1 1 auto; display: flex; background: var(--line); gap: 1px; min-height: 0; }
/* The two dividers, grabbable. cian-tui drags its borders with the mouse
   (`set_divider_ratio`) and this could only be moved by a key — and on macOS
   that key is Mission Control's. A hairline is not a target, so each handle
   is a few pixels of transparent hit area straddling the seam. */
#grip-panes, #grip-main { position: fixed; z-index: 5; }
#grip-panes { cursor: col-resize; width: 9px; }
#grip-main  { cursor: row-resize; height: 9px; left: 0; right: 0; }
#grip-panes:hover, #grip-main:hover, .dragging #grip-panes, .dragging #grip-main {
  background: var(--accent); opacity: .35;
}
/* While a drag is on, nothing else takes the pointer — a listing that
   selects rows under a divider drag is a listing fighting the gesture. */
.dragging, .dragging * { cursor: inherit !important; user-select: none !important; }
.pane[data-pane="left"] { flex: 0 0 var(--panes-pct); }
.pane[data-pane="right"] { flex: 1 1 auto; }
.pane {
  flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--pane-off);
  position: relative;   /* the active frame above hangs off this */
}
/* Two different questions, and they were one class.
   `.active` is *which pane is the current one* — what Tab switches, what the
   one-pane views show, what F12 zooms. `#work[data-focus]` is *where the keys
   actually are*, which the shell can take. Conflated, the file pane kept its
   accent frame while you were typing into the shell, so two surfaces claimed
   the keyboard at once. */
.pane.active { background: var(--pane); }
/* A diagram parked in the editor, under the fence that makes it. White ground
   whatever the theme: mermaid draws for a page, and its own dark theme still
   assumes ink darker than the lines it draws. */
.zone-diagram {
  display: flex; align-items: flex-start; justify-content: center;
  padding: 8px 0; overflow: auto;
}
.zone-diagram svg { max-width: 100%; height: auto; }
/* A proportion under the name. Behind the text and quiet: it is there to be
   compared at a glance, not read. */
#report .hit.barred { position: relative; }
#report .hit .bar {
  position: absolute; left: 0; top: 2px; bottom: 2px;
  background: var(--accent); opacity: 0.16; border-radius: 2px;
  pointer-events: none;
}
#report .hit.on .bar { opacity: 0.28; }
/* The desktop's own icon, in the tiles. Sized to the glyph it replaces so a
   tile does not change shape when the picture arrives. */
/* A picture you can zoom. `fit` is the state it opens in; once scaled it is
   positioned by transform, which does not reflow anything around it. */
/* The git column. One character wide, and it keeps its width in a repository
   or out of one so the names do not shift as you walk between them. */
.row .git { flex: 0 0 auto; width: 1.1em; text-align: center; opacity: 0.9; }
.row .git[data-git="staged"] { color: var(--k-exec); }
.row .git[data-git="modified"] { color: var(--k-code); }
.row .git[data-git="untracked"] { color: var(--dim); }
.row .git[data-git="conflict"] { color: var(--k-archive); font-weight: 700; }
.row .git[data-git="dirdirty"] { color: var(--dim); }
.vpic img.zoomable { cursor: grab; max-width: none; max-height: none; }
.vpic img.zoomable:active { cursor: grabbing; }
.vpic img.zoomable.fit { max-width: 100%; max-height: 100%; cursor: default; }
.zone-diagram.bad { color: var(--k-archive); font-size: 0.9em; justify-content: flex-start; padding-left: 12px; }
/* The two history arrows in the breadcrumb. Quiet until the pointer is on
   them: they are always drawn (a control that comes and goes cannot be aimed
   at) and they are not what the line is for. */
/* The crumb box is right-to-left so a long path clips at the head; that also
   reversed these two, so they read ▶ ◀. Isolated as their own left-to-right
   run. They sit at the trailing edge, which in an RTL box is the end that
   never gets clipped. */
.crumb .nav {
  margin-left: 6px; white-space: nowrap;
  direction: ltr; unicode-bidi: isolate;
}
.crumb .navb {
  display: inline-block; padding: 0 3px; cursor: pointer;
  color: var(--dim); user-select: none;
}
.crumb .navb:hover { color: var(--accent); }
/* The same two arrows in the viewer's title, for stepping between the files
   F3 opened together. */
.vhead .vnavb {
  display: inline-block; padding: 0 4px; cursor: pointer;
  color: var(--dim); user-select: none;
}
.vhead .vnavb:hover { color: var(--accent); }
.vhead .vat { color: var(--dim); margin: 0 2px; }
/* One tab per file F3 opened together. Named, so the strip answers "what else
   is open" and not only "how many". */
.vhead .vtabs {
  display: inline-flex; gap: 2px; overflow-x: auto; vertical-align: bottom;
  max-width: 62vw; scrollbar-width: none;
}
.vhead .vtabs::-webkit-scrollbar { height: 0; }
.vhead .vtab {
  padding: 0 8px; border-radius: 4px 4px 0 0; cursor: pointer;
  color: var(--dim); background: var(--pane-off);
  max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.vhead .vtab:hover { color: var(--text); }
.vhead .vtab.on {
  color: var(--accent); background: var(--pane); font-weight: 600;
  box-shadow: inset 0 -2px 0 var(--accent);
}
/* The handle on an inner shell split. Four pixels of hit area, invisible
   until the pointer is on it — the boundary is already drawn by the two
   panes; this is only somewhere to take hold of it. */
.scut { position: absolute; z-index: 3; }
.scut.v { width: 5px; margin-left: -2px; cursor: col-resize; }
.scut.h { height: 5px; margin-top: -2px; cursor: row-resize; }
.scut:hover, .dragging .scut { background: var(--accent); opacity: 0.35; }
/* Tone alone used to be the whole answer, on the argument that a frame is the
   loudest way to say something the cursor already says. It was asked about
   three times — on a light palette the two grounds are a couple of percent
   apart and the argument does not survive that. So: a frame, and only while
   the files actually hold the keys. */
/* The active frame, drawn over everything the pane contains.
   It was `box-shadow: inset` on `.pane`, which paints beneath the children —
   so on Windows, where a scrollbar takes real width and sits hard against the
   right edge of `.rows`, the right side of the frame was painted over by the
   scrollbar and simply was not there. macOS never showed it because an
   overlay scrollbar takes no layout. A pseudo-element on top, with no pointer
   events of its own, is the same two pixels where they can be seen. */
/* Three, not two. At two it is tasteful and easy to miss, and the frame's
   whole job is to be seen without being looked for — on a light palette
   especially, where the two grounds are a couple of percent apart and the
   frame is the only thing saying which side has the keys. */
#work[data-focus="files"] .pane.active::after {
  content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  border: 3px solid var(--mode-accent);
}
/* The mode's colour, on the frame of the surface holding the keys — which is
   where cian-tui puts it (`focus_badge_color`, render.rs:2134). It was only
   on the prompt row at the very bottom of the screen, which is the one place
   the eye is not while you narrow a listing. Same four colours, same
   meanings; with no mode in particular the frame is cian's own cyan, which
   is fixed — see `--cian` above for why it stopped being the palette's
   accent on 2026-09-06. */
#work { --mode-accent: var(--cian); }
#work[data-mode="search"]  { --mode-accent: var(--m-search); }
#work[data-mode="cmd"]     { --mode-accent: var(--m-command); }
#work[data-mode="visual"]  { --mode-accent: var(--m-visual); }
/* **シェルは金をやめた**（2026-09-06 の依頼 154）。「アクティブなパネルは
   シアン」で、シェルパネルも面の1つ ── どちらに鍵があるかを言う色が面ごとに
   違うと、覚えることが1つ増えるだけになる。シェル用の上書きを1行まるごと
   落として、既定（`--cian`）に落ちるようにした。緑（検索）と紫（コマンド）は**何を
   しているか**を言う色なので、そちらは残す。 */
/* And the pane that is not current steps back rather than merely being a
   shade darker — the eye should land on the live one without being asked. */
.pane:not(.active) .rows,
.pane:not(.active) .crumb,
.pane:not(.active) .dhead,
.pane:not(.active) .tabs { opacity: .62; }

/* The details view takes the whole window: it is the Explorer arrangement,
   where the listing is the thing you are looking at. Tab still crosses to the
   other pane; it simply comes to the front rather than sitting beside. */
#panes.one .pane { display: none; }
#panes.one .pane.active { display: flex; flex: 1 1 100%; }
/* Where the drop will land, said plainly. Two panes means a drop is always
   about to go into one of them and not the other. */
.pane.dropping { outline: 2px dashed var(--accent); outline-offset: -3px; }
/* A pane showing a server wears a different frame. The terminal build uses a
   carmine border for exactly this: the rows look like files, and mistaking
   somebody's server for your own disk is the one confusion worth spending a
   colour on. */
.pane.remote { outline: 2px solid var(--m-remote); outline-offset: -2px; }
/* Where you are. The most-read line in a file manager, and it was set two
   points smaller than the date column and in the dim colour — the priorities
   the wrong way round. Full size now, with the parents dim and the folder you
   are actually in in the text colour.

   `flex: 0 0 auto` is the fix for the clipping: a flex item shrinks by
   default, and this one was being squeezed to 30px around 38px of content, so
   the descenders were cut. (ASCII survived it; Japanese would not have.) */
.crumb {
  flex: 0 0 auto;
  padding: 3px 10px 1px;
  color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  /* The path is the one thing here worth copying out. */
  user-select: text; cursor: text;
  /* Clipped at the *head*, so a deep path keeps the end that says where you
     are. The box is right-to-left, which is what moves the ellipsis to that
     side; the run inside it is isolated back to left-to-right so the
     characters keep their order. `unicode-bidi: plaintext` here instead put
     the direction back to auto — the box behaved left-to-right again and
     truncated the only part worth keeping. */
  direction: rtl; text-align: left;
}
/* *One* isolate holding the whole path. Two of them — parents and here — are
   two runs, and in a right-to-left box two runs are laid out right to left:
   the folder you are in went off the left edge and only its parents showed. */
.crumb > .path { unicode-bidi: isolate; direction: ltr; }
.crumb .here { color: var(--text); font-weight: 600; }
/* Each ancestor is clickable, and says so on the way past. */
.crumb .seg:hover { color: var(--accent); text-decoration: underline; cursor: pointer; }
#work[data-focus="files"] .pane.active .crumb .here { color: var(--accent); }
/* The tab strip, and only when there is more than one — a row of chrome
   showing a single tab is a row of chrome saying nothing. */
.tabs { display: flex; gap: 2px; padding: 2px 4px 0; overflow: hidden; }
.tabs:empty { display: none; }
.tabs span {
  padding: 1px 8px; border-radius: 4px 4px 0 0; font-size: .8em;
  color: var(--dim); background: var(--pane-off);
  max-width: 14ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  cursor: default;
}
.tabs span.on { color: var(--text); background: var(--pane); font-weight: 600; }
.pane.active .tabs span.on { color: var(--accent); }
.rows { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; }

/* The scrollbars.
   Chromium's default on Windows is the wide grey trough with two arrow
   buttons, which is a 1995 control sitting inside a window that is trying not
   to look like one — and it is opaque, so it also hid the pane frame. These
   are drawn from the theme: no track, no buttons, a thumb that firms up when
   you are pointing at it. `--dim` and `--line` are per-palette, so this
   follows the eighteen looks without a rule each. */
* {
  scrollbar-width: thin;                        /* Firefox, and a hint to the UA */
  scrollbar-color: var(--line) transparent;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 5px;
  /* Inset by a transparent border rather than by width, so the thumb is
     narrow while the *hit area* stays a comfortable ten pixels. */
  border: 2px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--dim); background-clip: content-box; }
::-webkit-scrollbar-corner { background: transparent; }
/* The arrow buttons at the ends, which nothing here wants. */
::-webkit-scrollbar-button { display: none; }
.row {
  display: flex; align-items: center; gap: 8px;
  height: var(--cell-h); padding: 0 10px;
  white-space: nowrap;
}
.row .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
.row .size { flex: 0 0 auto; color: var(--dim); font-variant-numeric: tabular-nums; }
/* details — Explorer's columns, in Explorer's widths. Each fixed so they
   read as columns; a ☁ for a file that is listed but lives in the cloud. */
.row .when { flex: 0 0 12ch; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
.row .cloud { flex: 0 0 2ch; text-align: center; color: var(--dim); }
.row .kind { flex: 0 0 12ch; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* The mark column — the terminal build's `● `, in the mark colour. A colour
   on the name alone disappears the moment the row is the cursor; a bullet in
   its own column survives every background. */
.row .mark { flex: 0 0 2ch; color: var(--mark); font-weight: 600; }
/* The small leading icon, in classic and details both — the terminal build
   puts a Nerd glyph on every row, and the bundled font carries them. The
   tiles' much larger one overrides below. */
.row .glyph { flex: 0 0 1.6em; font-size: 1em; text-align: center; }
.rows.details .row .size { flex: 0 0 9ch; text-align: right; }
.rows.classic .row .size { flex: 0 0 8ch; text-align: right; }
.rows.details { padding-top: 0; }
/* The columns that no longer fit, dropped in the terminal build's order:
   the date first, then the size — the name is the last thing to go. */
.pane.no-when .row .when, .pane.no-when .dhead .when { display: none; }
.pane.no-size .row .size, .pane.no-size .dhead .size { display: none; }
/* And the ☁ column only when something is actually in the cloud. */
.pane.no-cloud .row .cloud { display: none; }
/* The column header. Built from the same class names as a row, so a column
   and its heading cannot drift apart in width. */
.dhead {
  flex: 0 0 auto; color: var(--dim); font-size: .78em;
  /* No band. A heading that is the same weight as the rows below it competes
     with them; a hairline and lighter ink is enough to say "this is the
     label row". */
  border-bottom: 1px solid var(--line);
  cursor: default; user-select: none;
}
.dhead .glyph { flex: 0 0 1.6em; }
.dhead .size { flex: 0 0 9ch; text-align: right; }
.dhead .sortable { cursor: pointer; }
.dhead .sortable:hover { color: var(--text); text-decoration: underline; }
/* `hidden` is only `display: none` in the browser's own stylesheet, and any
   author rule beats it — `.row { display: flex }` did, so the header stayed
   laid out in classic view as an empty band under the path. Said here, where
   it wins. */
.dhead[hidden] { display: none; }

/* The row under the cursor.
   It was a full-bleed bar of saturated accent with white text — the shape a
   file manager had in 2005, and the loudest thing on a 白磁 screen. A tint
   with a marker down its edge says the same thing without shouting it, and
   it lets a name keep the colour that says what kind of file it is. The
   marker is what survives on the palettes where a tint is nearly nothing. */
.row.cursor {
  background: var(--accent-dim);
  box-shadow: inset 3px 0 0 var(--accent);
  border-radius: 0 4px 4px 0;
}
#work[data-focus="files"] .pane.active .row.cursor {
  background: var(--sel-strong);
  box-shadow: inset 4px 0 0 var(--accent);
}
/* The pointer gets an answer too. Nothing here responded to it at all. */
.row:hover:not(.cursor) { background: var(--row-hover); }

/* The terminal build's file palette: the kind of a file is its colour, a
   directory and an executable are bold, dotfiles recede. */
.row.dir .name { color: var(--dir); font-weight: 600; }
.row.k-code .name { color: var(--k-code); }
.row.k-config .name { color: var(--k-config); }
.row.k-doc .name { color: var(--k-doc); }
.row.k-image .name { color: var(--k-image); }
.row.k-media .name { color: var(--k-media); }
.row.k-archive .name { color: var(--k-archive); }
.row.k-exec .name { color: var(--k-exec); font-weight: 600; }
.row.k-muted .name { color: var(--dim); }
.row.marked .name { color: var(--mark); }
/* The name stands out a little in the selected row without changing hue —
   the colour is already saying what kind of file it is. */
.row.cursor .name { font-weight: 600; }
#status {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; gap: .9em;
  padding: 0 12px 0 0; font-size: .78em; line-height: 2.1;
  /* The pane's own ground with one hairline above it. It was a solid band of
     `--line`, which is the shape a status bar had on Windows 95 and reads as
     a slab of chrome under the thing you are looking at. */
  background: var(--pane); color: var(--dim);
  border-top: 1px solid var(--line);
  white-space: nowrap; overflow: hidden;
}
/* The pane-and-mode badge, first and never dropped. Its colour is the mode's:
   the terminal build gives "am I in visual?" one glance, not a guess. */
#st-badge {
  flex: 0 0 auto; margin: 0 .2em 0 8px; padding: 0 .7em;
  font-weight: 600; font-size: .92em; line-height: 1.5;
  border-radius: 999px;
  background: var(--accent); color: var(--on-accent);
}
#st-badge.visual { background: var(--mark); }
#st-badge.filter { background: var(--k-exec, #3a7a4a); color: var(--on-accent); }
/* The chips, left to right from the badge — the terminal build's order.
   They were pushed to the right end to get the overflow to clip on the left,
   and the cost was that every chip *moved* on every keystroke: the name under
   the cursor is one of them, so walking a listing slid the whole row about.
   A thing that moves is a thing you cannot read. Dropping from the left is
   done by the message being last and taking the space instead. */
#st-chips {
  flex: 0 1 auto; display: flex; gap: .8em; overflow: hidden;
  justify-content: flex-start;
}
#st-chips span { flex: 0 0 auto; }
#st-chips .n { color: var(--text); }
#st-chips .mk { color: var(--mark); font-weight: 600; }
#st-chips .flt { color: var(--k-exec, #2f8f5b); }
#st-chips .git { color: rgb(130, 205, 150); }
#st-chips .git.dirty { color: rgb(240, 210, 120); }
#st-chips .disk { color: var(--dir); }
#st-chips .disk.warn { color: var(--mark); font-weight: 600; }
#st-chips .disk.crit { color: #d04a3a; font-weight: 600; }
#st-chips .op { color: var(--accent); font-weight: 600; }
#st-msg { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; font-style: italic; color: var(--text); }
/* The name under the cursor changes on every j and k. Given a floor it stops
   dragging everything to its right back and forth as the name gets shorter. */
#st-chips .cur { min-width: 12ch; }
#st-msg.good { color: var(--msg-good); }
#st-msg.warn { color: var(--msg-warn); }
#st-msg.bad  { color: var(--msg-bad); font-style: normal; }
#st-shell { flex: 0 0 auto; color: var(--dir); }

/* The order these sit in.
   Not one of them had a z-index, so they stacked in the order they happen to
   appear in this file — and the editor, added last, covered the question it
   raises. Closing a file with unsaved edits in it did nothing you could see:
   the confirmation was open, behind the editor. Stated, so that adding a
   fourth overlay is a decision rather than an accident.

   **And it happened again**, in this very pair. `#view` and `#report` shared
   a level, so they stacked by document order — and `#report` is written
   first, which means the editor covered it. `?` inside the editor therefore
   opened its key list *behind the file*: `report.on` was true, the title was
   right, and nothing was on screen. I checked the state and called it
   verified, which is how this class of bug survives.

   A sheet raised over a surface is above that surface. There is no case where
   the editor should hide a list opened from inside it. */
#view   { z-index: 10; }   /* a surface: it replaces the listing */
#report { z-index: 11; }   /* a sheet: it is raised over whatever is beneath */

/* The shell's sixteen. Named rather than fixed, so each look chooses them —
   a shell frozen to one palette would ignore 白磁 and 陰翳 alike. These are
   the defaults; the dark looks override them below. */
:root {
  --c0:#2b3333; --c1:#c0392b; --c2:#2f8f5b; --c3:#a9781a;
  --c4:#2b6cb0; --c5:#8e44ad; --c6:#17706a; --c7:#8b9493;
  --c8:#5c6664; --c9:#e05a4a; --c10:#43b57a; --c11:#d2a03a;
  --c12:#4a90d9; --c13:#b06bd0; --c14:#2aa198; --c15:#2b3333;
}
/* `data-dark` too, not only the two dark looks: the eighteen shared palettes
   arrive from the engine and half of them are dark, but these sixteen were
   keyed on `data-look` alone — so dracula and tokyo-night drew the shell in
   the light defaults, near-invisible on their grounds. */
:root[data-look="inei"], :root[data-look="terminal"], :root[data-dark="1"] {
  --scrim: rgba(4, 6, 10, .62);
  --c0:#3b3b3b; --c1:#e06c75; --c2:#98c379; --c3:#e5c07b;
  --c4:#61afef; --c5:#c678dd; --c6:#56b6c2; --c7:#d9d0c5;
  --c8:#6b6b6b; --c9:#ff7b86; --c10:#b5e08f; --c11:#ffd88a;
  --c12:#82c8ff; --c13:#e0a0f0; --c14:#7fe0e8; --c15:#ffffff;
}

/* The third surface, not a panel laid over the other two.
   cian-tui's normal layout is three: the file panes on top and the shell
   below, always there. This was a fixed overlay that appeared on Shift+J,
   which meant the shell was not part of the program until you asked for it —
   and, worse, that scrolling a listing to its last row put that row
   underneath the shell where it could not be seen or reached. */
#shell {
  flex: 0 0 calc(100% - var(--main-pct));
  display: flex; flex-direction: column; min-height: 0;
  background: var(--pane);
  /* The seam with the listing above. Always neutral: *which* panel has the
     keys is the frame's job, below, and one border cannot answer both
     questions — which is what it was trying to do. */
  border-top: 2px solid var(--line);
  position: relative;   /* the frame below hangs off this */
}
#shell[hidden] { display: none; }
/* Same signal as a file pane, and now the same *shape*.
   It was one accented line along the top, while a file pane with the keys
   gets a frame on all four sides — so the two surfaces answered the same
   question in two different visual languages, and the shell's answer was in
   a place the eye reads as "the edge between things" rather than as "this
   one". Reported as the mark being in an odd place and the other three sides
   missing, which was exactly right: they were never drawn.
   A pseudo-element above the contents, as the file panes use, so the panel's
   own scrollbars and grids cannot paint over it. */
#work[data-focus="shell"] #shell::after {
  content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
  border: 2px solid var(--mode-accent);
}

/* F12 — the *focused* surface fills the window, which is what the terminal
   build's `toggle_zoom` does. It only ever grew the shell here, whichever
   pane you were standing in. The others are hidden rather than shrunk: a
   zoom that leaves slivers of the others is a smaller zoom, not a zoom. */
#work[data-zoom="files"] #shell { display: none; }
#work[data-zoom="files"] .pane:not(.active) { display: none; }
#work[data-zoom="files"] .pane.active { flex: 1 1 100%; }
#work[data-zoom="shell"] #panes { display: none; }
#work[data-zoom="shell"] #shell { flex: 1 1 auto; }

/* Typing into four servers at once should not look like typing into one. */
#shell.zoom { height: 88%; }
/* The two surfaces stack; between them and the foot bars, the window is
   accounted for exactly. */
/* The overlays are its siblings, not its children. They were inside it, and
   `#work` has no z-index of its own — so it trapped them in its stacking
   level and the viewer (a sibling, z-index 10) painted over the menu that was
   supposed to be about it. Bug shape ③, from the other direction: not a later
   rule winning, but a parent nobody looked at. */
#work {
  position: fixed; left: 0; right: 0; top: 0;
  bottom: calc(var(--status-h) + var(--hints-h));
  display: flex; flex-direction: column; min-height: 0;
}
/* 状態はキーの居場所と別。同期入力とログはこの上辺で、フォーカスに関係なく
   いつでも見える ── 枠は「いまキーがここにある」だけを言う。 */
#shell.sync { border-top-color: var(--mark); }
/* Recording. The terminal build turns the frame carmine for the same
   reason: a shell being written to a file must not look like one that
   is not. */
#shell.logging { border-top-color: var(--msg-bad); }
#shell.logging .vhead { color: var(--msg-bad); }
/* The key hints — what the keys do *here*, right now. The terminal build
   carries this bar and the window did not, which is most of why the two felt
   like different programs: cian tells you what you can press, continuously,
   and a window that stayed silent made you remember instead. Ordered by how
   often each is reached for, so a narrow window drops from the end. */
#hints {
  /* Fixed, like the status line it sits on — the panes fill the window and
     would otherwise push this off the bottom edge, laid out and invisible. */
  position: fixed; left: 0; right: 0; bottom: var(--status-h);
  display: flex; gap: 1.4em; overflow: hidden; white-space: nowrap;
  padding: 4px 12px; font-size: .78em; color: var(--dim);
  /* No border of its own: the status line below it already draws one, and
     two hairlines four pixels apart is a seam, not a structure. */
  background: var(--pane);
}
/* The filter bar, one prompt row above the hints — where the terminal build
   types it. The listing stays fully visible while it narrows. */
#fbar {
  position: fixed; left: 0; right: 0;
  bottom: calc(var(--status-h) + var(--hints-h));
  display: flex; align-items: center; gap: .5em;
  padding: 3px 10px; background: var(--pane);
  /* The mode's own colour, cian-tui's: green while searching or narrowing,
     purple on the command line. One glance says which of the two the keys
     are going to, which matters because they take the same letters. */
  border-top: 2px solid var(--m-search);
  z-index: 22;   /* over the finder's list, which it is typing into */
}
#fbar[data-mode="cmd"] { border-top-color: var(--m-command); }
#fbar b { color: var(--m-search); font-weight: 600; }
#fbar[data-mode="cmd"] b { color: var(--m-command); }
/* The `#fbar b { color: var(--accent) }` that used to sit below these two won
   on source order and painted the `/` and the `:` the same colour — the very
   thing the two rules above exist to tell apart. Bug shape ③, in the file
   that names it. */
/* `hidden` is the browser's own display:none, and the flex above beats it —
   the bar showed at startup, empty, the day it was added. Bug shape ③. */
#fbar[hidden] { display: none; }
#fbar input {
  flex: 1 1 auto; border: 0; outline: 0; background: transparent;
  color: var(--text); font: inherit;
}
#fbar #f-count { color: var(--dim); }
#hints b { color: var(--accent); font-weight: 600; margin-right: .35em; }
#hints span { flex: 0 0 auto; }
/* The strip read as one more row of the listing above it — a line with
   `Aserver  shell 2` in it and nothing saying what it belonged to. cian-tui
   never had the problem because its tabs are drawn *on the panel's border*,
   which attaches them to the box; a window has to say it another way.
   Two things do it here: a prompt mark at the left, which is what a terminal
   looks like anywhere, and tabs that sit on the seam with the active one
   open at the bottom into the panel below — the shape every tab has had
   since tabs existed. */
#shell .vhead::before {
  content: "❯"; flex: 0 0 auto; margin-right: .55em;
  color: var(--accent); font-weight: 700; opacity: .85;
}
.stabs { display: flex; gap: 3px; align-items: stretch; margin-right: .8em; }
.stabs span {
  padding: 1px .8em; cursor: pointer; color: var(--dim);
  border-radius: 4px 4px 0 0; max-width: 16ch;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border: 1px solid transparent; border-bottom: 0;
  /* Down onto the strip's own bottom rule, so the open tab breaks it. */
  margin-bottom: -1px;
}
/* The current tab, and *whether the keys are in it* — two different things,
   which one solid accent block could not say. Unfocused it is a quiet chip;
   focused it takes the accent. It used to be a hard square of accent even
   while you were typing in a file pane, which made the least important thing
   on screen the most visible. */
.stabs span.on {
  background: var(--pane); color: var(--text); font-weight: 600;
  border-color: var(--line); border-bottom: 1px solid var(--pane);
}
/* The keys are in it: the open tab takes the accent along the edge where it
   meets the panel, not its top.
   On the top it was a second horizontal accent line four pixels under the
   panel's own — 2px border, 3px of strip padding, 1px of tab border — and
   two parallel lines that close together read as one botched edge rather
   than as two things. ("上辺が2つ線が入ったように見える".) At the bottom it
   is the shape a tab has always had, and it matches the editor's file tabs,
   which are the same idea one panel over. */
/* `--mode-accent`、枠と同じ ── タブの印だけアクセント色のままだった時期が
   あり、3倍で撮って初めて見えた類のずれだった。同じことを言っている二つは
   同じ色で言う。 */
#shell.on .stabs span.on { color: var(--mode-accent); box-shadow: inset 0 -2px 0 var(--mode-accent); }
.stabs span:hover:not(.on) { color: var(--text); background: var(--pane-off); }
#s-title { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* The strip was 39px for three short words. Its own line-height rather than
   the listing's 26px row. */
#shell .vhead {
  padding: 3px 10px 0; line-height: 1.7; align-items: flex-end;
  background: var(--pane-off); border-bottom: 1px solid var(--line);
}
.sgrid { user-select: text; cursor: text; }
#shell.sync .vhead { color: var(--mark); }
/* The panes of a split, placed where the engine says. Absolute rather than
   flex: the layout is a tree and the engine has already turned it into
   rectangles, so re-deriving it here out of nested boxes would be a second
   implementation of the same arithmetic. */
.spanes { flex: 1 1 auto; position: relative; overflow: hidden; }
/* `:preview` — what the cursor is on, in the shell panel's area.
   The window used to open the whole editor over the screen for this, which is
   not a glance at a file, it is opening it. cian-tui borrows the shell
   panel's pixels (preview.rs) and leaves the PTY running underneath; so does
   this. Its own scroll, because a preview of a long file should not move the
   listing you are walking. */
.spreview {
  flex: 1 1 auto; min-height: 0; overflow: auto;
  padding: 6px 10px; font-family: var(--mono); font-size: var(--size);
  line-height: 1.35; white-space: pre; tab-size: 4;
  color: var(--text); background: var(--pane);
}
.spreview[hidden] { display: none; }
/* While the preview has the panel, the shell's own grid steps aside rather
   than being torn down — it is still running. */
#shell.previewing .spanes { display: none; }
.spreview .note { color: var(--dim); font-style: italic; white-space: pre-wrap; }
.spreview img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; margin: auto; }
.spreview .dirrow { color: var(--text); }
.spreview .dirrow.d { color: var(--accent); font-weight: 600; }
.sgrid {
  position: absolute; overflow: hidden; padding: 4px 8px;
  white-space: pre; line-height: 1.25;
  /* Strictly the mono stack. This is a vt100 grid: one proportional glyph
     and every column to its right is somewhere else. */
  font-family: var(--mono);
  box-sizing: border-box;
}
/* Which pane the keys go to. A row of identical shells with no way to tell
   which is listening is the failure mode of every split terminal. */
/* Two pixels, matching the file panes: one was a hairline that disappeared
   against half the palettes. */
/* Which split pane is current, and — separately — whether the keys are in
   the shell at all. Painted with the accent unconditionally, the panel went
   on wearing the focus colour while you were typing in a file pane, so two
   surfaces claimed the keyboard at once. Quiet when the keys are elsewhere. */
/* …and only when there is more than one pane to tell apart. A single pane
   filling the panel wore a frame whose top edge ran the full width a few
   pixels below the panel's own top border — the third of the three parallel
   lines that made the top of this panel look broken. */
#shell.split .sgrid.on { box-shadow: inset 0 0 0 2px var(--line); }
#shell.on.split .sgrid.on { box-shadow: inset 0 0 0 2px var(--accent); }
/* The seam between split panes, drawn on each pane's own left/top edge —
   the panes are absolutely placed from engine fractions, so an
   adjacent-sibling border landed on whichever node happened to be second in
   the DOM, nowhere near the seam. */
.sgrid { box-shadow: inset 1px 0 0 var(--line), inset 0 1px 0 var(--line); }
.sgrid .cur { background: var(--accent); color: var(--on-accent); }
.sgrid .inv { filter: invert(1); }
#find { z-index: 20; }   /* over whatever it is searching — the viewer too */
#prog { z-index: 25; }   /* over the listing it is changing, under the asking */
#ask  { z-index: 30; }   /* always the top: it is the thing being answered */

/* The progress sheet. Same furniture as the confirm — one dialog to know
   rather than two — with a bar and a line of numbers in the body. */
#prog {
  position: fixed; inset: 0; display: flex;
  align-items: center; justify-content: center;
  background: var(--scrim);
}
#prog[hidden] { display: none; }
#prog .sheet { min-width: 34rem; }
/* Tighter than the listing behind it: this is four lines that belong
   together, not rows to be scanned.

   `white-space: normal` matters more than it looks. The shared `.body` keeps
   whitespace, because the confirm sheet puts a list of filenames in it as one
   `\n`-joined string — and that turned the newlines *between these elements
   in the markup* into blank lines, spacing the bar out over 265px. Measured,
   not guessed: nothing in the box model accounted for it. */
#prog .sheet .body { line-height: 1.6; white-space: normal; }
/* Shortened in JS, in the middle — the terminal build's `truncate_middle`.
   It was `direction: rtl` for a while, which clips the head in the right
   place and then reorders the punctuation: a path came out starting with
   `private/` and ending in a stray `/` that belonged at the front. */
#p-now { color: var(--dim); overflow: hidden; white-space: nowrap; }
#prog .bar {
  height: 8px; margin: .7em 0 .4em; border-radius: 4px;
  background: var(--accent-dim); overflow: hidden;
}
#p-fill { height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }
#p-num { color: var(--dim); font-variant-numeric: tabular-nums; }

#ask {
  position: fixed; inset: 0; display: flex;
  align-items: center; justify-content: center;
  background: rgba(6, 8, 14, .72);
}
#ask[hidden] { display: none; }
.sheet {
  min-width: 380px; max-width: 70vw;
  background: var(--pane); border: 1px solid var(--accent);
  border-radius: 6px; padding: 16px 18px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, .5);
}
/* Wide enough for the answer. A path is the long thing anybody types here,
   and at 380px you could see the last thirty characters of what you had
   written — which is the width of a box for a filename, not for a path.
   `min()` rather than a flat width so a narrow window still fits. */
/* **`#ask`, not a bare `.sheet.wide`.** That class already existed — the
   finder wears it — and its rule sits *later* in this file at the same
   specificity, so a bare one here loses to it and the box stayed the
   finder's width. Exactly the after-wins trap that is written up three
   times in ROADMAP; I walked into it while fixing a width. */
#ask .sheet.wide { min-width: min(60rem, 84vw); }

/* The gutter marks: which lines differ from the file on disk.
   A bar in the margin, not a wash behind the text — a colour under the words
   reads as "look here", and an edited line is not more important than the
   rest of the file, only newer. Three pixels, the width every editor uses for
   this, and the two colours cian already has for added and changed. */
.gut-new, .gut-changed {
  width: 3px !important; margin-left: 3px;
}
/* `--mark` for a line that is wholly new and `--accent` for one that was
   changed: the two the palette already spends on "this one" and "this is
   cian speaking", so a theme that moves them moves these with it. */
.gut-new { background: var(--mark); }
.gut-changed { background: var(--accent); }
.sheet .head { color: var(--accent); margin-bottom: 10px; }
/* The command's own name, under the field it fills in. Dim, because it is a
   thing to learn rather than a thing to read every time. */
.sheet .note {
  margin-top: 8px; font-size: .85em; color: var(--dim);
  white-space: normal;
}
.sheet .body {
  color: var(--text); margin-bottom: 16px;
  max-height: 40vh; overflow-y: auto;
  /* The list of what is about to happen is the one thing here worth reading
     twice, and sometimes worth copying into a message to somebody. */
  user-select: text; cursor: text;
  white-space: pre-wrap; word-break: break-all;
}
.sheet .buttons { display: flex; gap: 8px; justify-content: flex-end; }
.sheet button {
  font: inherit; padding: 5px 14px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--pane-off); color: var(--text);
}
.sheet button.go { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.sheet .field {
  width: 100%; font: inherit; color: var(--text);
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 8px;
}
.sheet .field:focus { outline: none; border-color: var(--accent); }

/* The chat. Above both — it can be opened from a report (the AI answers that
   are lists) and the viewer (summarise this file), and the thing you opened
   is the thing that should be in front.

   **Its own z-index, not a shared one.** `#view` and `#report` were both 10
   once, and which one you saw was decided by document order — the sheet
   opened *behind* the editor and three rounds went into "it says it is open
   and it is not there". Written as its own number so the question has an
   answer. */
#chat { z-index: 12; }

#view, #report, #chat {
  /* They replace the listing, not the whole window: the hint and status bars
     stay visible underneath — the terminal build never covers them, and every
     say() from viewer code used to land on a bar nobody could see. */
  position: fixed; top: 0; left: 0; right: 0;
  bottom: calc(var(--status-h) + var(--hints-h));
  display: flex; flex-direction: column;
  background: var(--pane); color: var(--text);
}
#view[hidden], #report[hidden], #chat[hidden] { display: none; }

/* The transcript scrolls; the turn being typed does not move. */
.cbody { flex: 1 1 auto; overflow-y: auto; padding: 10px 12px; }
.cturn { margin: 0 0 12px; max-width: 78ch; }
.cwho {
  font-weight: 700; letter-spacing: .02em;
  display: block; margin-bottom: 2px;
}
/* Who is speaking, in two colours that are actually two colours. The first
   pair were the accent and --k-config, and on 白磁 those are both teal a
   shade apart — the names were telling them apart in theory. The terminal
   build separates the turns by *glyph* (▍ / ◆); a window has room to do it
   by colour, which is read faster. */
.cturn.you .cwho { color: var(--accent); }
.cturn.ai  .cwho { color: var(--k-doc); }
/* The words themselves. `pre-wrap` because an answer arrives with its own
   line breaks and its own indentation, and a model asked for a command
   replies with a command — reflowed, that is a command that does not run. */
.ctext { white-space: pre-wrap; word-break: break-word; }
.cturn.you .ctext {
  border-left: 2px solid var(--accent);
  padding-left: 8px; color: var(--text);
}
/* Waiting. One line that says so, rather than an empty screen: an answer that
   takes twenty seconds and says nothing reads as an answer that is not
   coming. */
.cwait { color: var(--dim); font-style: italic; }

.cfoot {
  flex: 0 0 auto; border-top: 2px solid var(--accent);
  background: var(--pane-off);
}
#c-in {
  display: block; width: 100%; box-sizing: border-box;
  border: 0; outline: 0; resize: none;
  background: transparent; color: var(--text);
  font: inherit; padding: 6px 10px; max-height: 40vh;
}
.chint { padding: 2px 10px 5px; color: var(--dim); font-size: .85em; }
#report .hits { flex: 1 1 auto; max-height: none; margin: 0; border: 0; }
/* The narrowing box. Accented like every other place cian is taking text —
   the terminal build gives one look to "I am typing into something". */
#r-q {
  flex: 0 0 auto; border: 0; outline: 0;
  border-bottom: 2px solid var(--accent);
  background: var(--pane-off); color: var(--text);
  font: inherit; padding: 5px 10px;
}
#r-q[hidden] { display: none; }
/* The finder types into the prompt row at the foot, like everything else, so
   its own box is gone and the sheet holds only the hits. It sat behind a
   scrim over the very listing it was searching. */
#find-q { display: none; }
/* A sheet raised by a search wears the search colour, the way the pane does
   while the prompt is up — `Ctrl+F` and `Shift+F` end in a list, and the list
   is where you are still searching. `#find` is the `//` picker, which types
   into the same prompt. */
#report[data-mode="search"], #find .sheet {
  box-shadow: inset 0 0 0 2px var(--m-search);
}
#report .hit { cursor: default; }
/* The tick box on a review row. Its own hit area, because clicking the box
   and clicking the row mean different things. */
#report .hit .box {
  flex: 0 0 2ch; text-align: center; cursor: pointer;
  color: var(--accent); font-weight: 600;
}
#report .hit.off .box { color: var(--dim); font-weight: 400; }
/* An unticked row recedes — it is still readable, and it is not going to
   happen. */
#report .hit.off { opacity: .55; }
#report .hit.on .box { color: var(--on-accent); }
#report .hit .n {
  flex: 0 0 auto; color: var(--dim); font-variant-numeric: tabular-nums;
  min-width: 9ch; text-align: right;
}
#report .hit.on .n { color: var(--on-accent); }
#report .hit .sub { flex: 2 1 0; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
#report .hit.on .sub { color: var(--on-accent); }
.vhead, .vfoot {
  display: flex; gap: 12px;
  padding: 6px 10px; background: var(--pane-off); color: var(--dim);
  white-space: nowrap; overflow: hidden;
}
.vhead { justify-content: space-between; }
/* vim's command line starts at the left edge, the way it does in vim. The
   footer was `space-between`, which pushed the `:` prompt to the far right of
   a wide window — a command line in a place no vim has ever put one. */
.vfoot { justify-content: flex-start; align-items: baseline; }
.vfoot > * { flex: 0 0 auto; }
.vhead { border-bottom: 1px solid var(--line); }
.vfoot { border-top: 1px solid var(--line); }
/* Monaco measures this box and lays itself out inside it, so it must have a
   height of its own — a flex child with `min-height: 0` rather than one that
   grows to fit content it is also being asked to scroll. */
.vbody { flex: 1 1 auto; min-height: 0; }
.vbody[hidden] { display: none; }
/* A picture is shown whole, at its own size until that is bigger than the
   window — a file manager's preview should answer "what is this" before it
   answers "at what magnification". */
.vpic {
  flex: 1 1 auto; min-height: 0; display: flex;
  align-items: center; justify-content: center; overflow: auto;
  background: var(--pane-off);
}
.vpic[hidden] { display: none; }
.vpic img, .vpic embed { max-width: 100%; max-height: 100%; object-fit: contain; }

/* ── The Markdown preview ────────────────────────────────────────────────
   The one place this build can be better than the terminal rather than
   merely equal to it. A terminal renders Markdown in one font at one size;
   a window can set it, and a document that is set properly is read faster
   than the same words in a grid.

   The measure is capped at 34rem — around 70 characters, which is where
   the eye stops having to hunt for the start of the next line. Everything
   else here follows from that one decision. */
.vread {
  flex: 1 1 auto; min-height: 0; overflow: auto;
  padding: 3rem 2rem 6rem;
  color: var(--text);
  /* Proportional for prose. The Nerd Font stays for code, where the
     columns matter; body text in a monospace face is a terminal
     pretending to be a page. */
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP",
               -apple-system, "Segoe UI", system-ui, sans-serif;
  font-size: calc(var(--size) * 1.05);
  line-height: 1.85;
}
.vread[hidden] { display: none; }
.vread > * { max-width: 34rem; margin-left: auto; margin-right: auto; }

.vread h1, .vread h2, .vread h3, .vread h4, .vread h5, .vread h6 {
  line-height: 1.35; text-wrap: balance;
  /* `auto` kept in the shorthand: a later `margin: 2.4em 0 …` silently
     overrides the centring above, which is exactly what happened — the
     headings sat flush left while the table floated in the middle. */
  margin: 2.4em auto .8em; font-weight: 650;
}
.vread > :first-child { margin-top: 0; }
.vread h1 { font-size: 1.9em; letter-spacing: -0.01em; }
/* A rule under the top two, which is what a reader uses to find where a
   section begins when skimming rather than reading. */
.vread h1, .vread h2 { padding-bottom: .3em; border-bottom: 1px solid var(--line); }
.vread h2 { font-size: 1.45em; }
.vread h3 { font-size: 1.18em; }
.vread h4, .vread h5, .vread h6 { font-size: 1em; color: var(--dim); }

.vread p { margin: 0 auto 1.15em; }
.vread ul { margin: 0 auto 1.15em; padding-left: 1.4em; }
.vread li { margin: .3em 0; }
.vread li > ul { margin: .3em 0 .3em; }
.vread li.task { list-style: none; margin-left: -1.4em; }
.vread li.task .box { display: inline-block; width: 1.4em; color: var(--accent); }
/* A box you can press should say so before you press it — the cursor and a
   little lift on hover. Without them it is a character that happens to be
   clickable, which nobody finds. */
.vread li.task .box.press { cursor: pointer; border-radius: 3px; }
.vread li.task .box.press:hover { background: var(--sel-strong); }

.vread a { color: var(--dir); text-underline-offset: .18em; }
.vread a:hover { color: var(--accent); }

/* Code keeps the monospace face — that is what it is for. The inline form
   is tinted rather than boxed, because a box every few words turns a
   paragraph into a fence. */
.vread code {
  font-family: var(--mono, ui-monospace, monospace);
  font-size: .88em; background: var(--accent-dim);
  padding: .12em .35em; border-radius: 4px;
}
.vread pre {
  margin: 0 auto 1.4em; padding: 1em 1.1em; max-width: 44rem;
  background: var(--pane-off); border: 1px solid var(--line); border-radius: 8px;
  overflow-x: auto;
}
.vread pre code { background: none; padding: 0; font-size: .9em; line-height: 1.6; }

/* A quote is set in from the measure and marked, not boxed: it is still
   the same document. */
.vread blockquote {
  margin: 0 auto 1.2em; padding: .1em 0 .1em 1.1em;
  border-left: 3px solid var(--accent-dim); color: var(--dim);
}
.vread blockquote p:last-child { margin-bottom: 0; }

.vread table {
  border-collapse: collapse; margin: 0 auto 1.4em; max-width: 44rem;
  font-size: .95em; font-variant-numeric: tabular-nums;
}
.vread th, .vread td { padding: .45em .9em; border-bottom: 1px solid var(--line); }
.vread th { text-align: left; font-weight: 650; color: var(--dim); }
.vread tbody tr:hover { background: var(--pane-off); }

.vread hr { border: 0; border-top: 1px solid var(--line); margin: 2.4em auto; }
/* A diagram gets more width than prose — it is looked at, not read line by
   line — and scrolls inside itself rather than widening the page. */
.vread .diagram { max-width: 48rem; margin: 0 auto 1.6em; overflow-x: auto; text-align: center; }
.vread .diagram svg { max-width: 100%; height: auto; }
.vread .diagram-error {
  max-width: 44rem; margin: 0 auto .5em; padding: .4em .8em;
  color: var(--mark); background: var(--accent-dim); border-radius: 6px; font-size: .9em;
}
.vread del { color: var(--dim); }
/* Which byte the next digit lands on. A hex editor with no cursor is a hex
   editor you overwrite the wrong byte with. */
.hexcur { background: var(--accent); color: var(--on-accent) !important; }
/* Dimmed, because it is context rather than content — the line is the thing
   being read, and blame that competes with it is blame in the way. */
.blame { color: var(--dim) !important; opacity: .8; margin-right: 1ch; }
/* vim's mode line and its `:` prompt live in the footer, and monaco-vim puts
   them there as plain text. */
/* The `:` prompt takes the whole line while it is up.
   monaco-vim leaves `--NORMAL--` sitting to its left, which vim does not: in
   vim the last line *becomes* the command line. Leaving the mode there pushed
   the colon a hundred pixels in from the edge — a command line in a place no
   vim has ever put one. */
/* While a command is being typed, the frame says so.
   The terminal build gives a typed prompt one look wherever it is raised — a
   bar, in a colour nothing else wears — precisely so that "this is taking
   text" never has to be worked out. Here it is the editor's own frame, which
   is what was asked for, and a tinted line to join it to the prompt. */
#view:has(.vfoot input) { box-shadow: inset 0 0 0 2px var(--accent); }
.vfoot:has(input) {
  background: var(--accent-dim);
  border-top-color: var(--accent);
  color: var(--text);
}
.vfoot:has(input) > span:not(:has(input)) { display: none; }
.vfoot > span:has(input),
.vfoot > span:has(input) > span { flex: 1 1 auto; min-width: 0; display: flex; }
.vfoot input {
  flex: 1 1 auto; min-width: 0;
  background: transparent; border: 0; color: var(--text);
  font: inherit; outline: none;
}

#find {
  position: fixed; inset: 0; display: flex;
  align-items: flex-start; justify-content: center;
  padding-top: 10vh;
  background: var(--scrim);
  /* Repeated from the stack order above, and it has to be: this block is
     later in the file and at the same specificity, so the plain `#find {
     z-index: 20 }` there was being overwritten by a rule that set no
     z-index at all. The menu opened *behind* the file it was about. */
  z-index: 20;
}
#find[hidden] { display: none; }
.sheet.wide { min-width: min(70vw, 46rem); max-width: 70vw; padding: 12px; }
.hits {
  margin-top: 10px; max-height: 50vh; overflow-y: auto;
  border-top: 1px solid var(--line);
}
.hit {
  display: flex; align-items: center; gap: 8px;
  height: var(--cell-h); padding: 0 6px;
  white-space: nowrap; overflow: hidden;
}
/* Clipped at the head, because the tail of a path is the part that says
   which file. `direction: rtl` is what puts the ellipsis on that side — and
   on its own it also *reorders* the string, walking a trailing `)` or `/`
   round to the front. `unicode-bidi: plaintext` keeps the run in its own
   (left-to-right) order inside the right-to-left box. */
.hit .p {
  flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis;
  direction: rtl; text-align: left; unicode-bidi: plaintext;
}
.hit span + span { flex: 0 0 auto; color: var(--dim); }
/* A list that asked for its second column to line up. The widest name sets
   `--name-w` in the renderer; every row's name column takes it, so the paths
   beside them start at the same place and can be read down. */
#report[data-align] .hit .p {
  flex: 0 0 var(--name-w); direction: ltr; text-align: left;
}
#report[data-align] .hit .sub { flex: 1 1 0; direction: rtl; unicode-bidi: plaintext; }
/* 説明の一覧は折り返す ── パスの一覧と違って、切られて困るのは後半。 */
#report[data-wrap] .hit {
  height: auto; min-height: var(--cell-h); align-items: baseline;
  white-space: normal; padding-top: 5px; padding-bottom: 5px;
}
#report[data-wrap] .hit .p {
  white-space: pre; overflow: visible; text-overflow: clip;
  color: var(--accent); font-weight: 600;
}
#report[data-wrap] .hit.on .p { color: var(--on-accent); }
#report[data-wrap] .hit .sub {
  direction: ltr; white-space: normal; overflow: visible;
  text-overflow: clip; line-height: 1.5;
}
/* Help puts the keys in a fixed column so they line up down the page, and
   lets the description take whatever is left. The keys are the thing being
   looked up; a ragged left edge makes them hard to scan. */
.hit .k { flex: 0 0 13rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.hit .w { flex: 1 1 auto; color: var(--text); white-space: normal; }
.group { padding: 0.9rem 0.75rem 0.3rem; font-size: 0.78rem; letter-spacing: 0.08em; color: var(--dim); }
.group:first-child { padding-top: 0.2rem; }
/* The help rows are the one place a row may be taller than a cell. Every
   other list here is one line per file and clips deliberately; help is prose,
   and the fixed height with `overflow: hidden` is precisely what cut the
   bottom off the old help screen. It scrolls, and it gets more of the window
   than the finder does — nobody is reading help and a listing at once. */
#find.help .hits { max-height: 74vh; }
#find.help .hit { height: auto; min-height: var(--cell-h); padding: 4px 6px; white-space: normal; overflow: visible; align-items: baseline; }
.hit.on span + span { color: var(--on-accent); }
.hit.d .p { color: var(--dir); }
.hit.on { background: var(--accent); color: var(--on-accent); }
.hit.on .p { color: var(--on-accent); }
.foot {
  margin-top: 8px; font-size: .8em; color: var(--dim);
  display: flex; justify-content: space-between;
}
.sheet button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <div id="work">
  <div id="panes">
    <section class="pane active" data-pane="left">
      <div class="tabs"></div>
      <div class="crumb"></div>
      <div class="dhead row" hidden></div>
      <div class="rows"></div>
    </section>
    <section class="pane" data-pane="right">
      <div class="tabs"></div>
      <div class="crumb"></div>
      <div class="dhead row" hidden></div>
      <div class="rows"></div>
    </section>
  </div>
  <!-- The shell. Docked under the panes rather than over them: it is a place
       you look at while you work, not a thing you open instead of working. -->
  <div id="shell" hidden>
    <div class="vhead"><span id="s-tabs" class="stabs"></span><span id="s-title"></span><span id="s-about"></span></div>
    <div class="spanes" id="s-panes"></div>
    <!-- The cursor-follow preview borrows this panel's pixels, exactly as the
         terminal build's does: the shell keeps running underneath and comes
         back the moment the keys go to it. -->
    <div class="spreview" id="s-preview" hidden></div>
  </div>
  <!-- The filter, typed in place. It used to raise the full-screen search
       sheet — a dark scrim over the very listing being narrowed. The terminal
       build types this on its prompt row, and this bar is that row. -->
  <!-- The grips for the two dividers. Placed by measurement rather than by
       flow, because the seam they straddle is a 1px gap between flex items. -->
  <div id="grip-panes"></div>
  <div id="grip-main"></div>
  <div id="fbar" hidden>
    <b id="f-sign">/</b><input id="f-input" autocomplete="off" spellcheck="false"><span id="f-count"></span>
  </div>
  <div id="hints"></div>
  <!-- The status line, the terminal build's chip row: which pane and mode,
       how many things, how many marked, the file under the cursor, the
       filter, the disk — always there, with the transient message beside
       them rather than instead of them. -->
  <div id="status">
    <span id="st-badge"></span><span id="st-chips"></span><span id="st-msg"></span><span id="st-shell"></span>
  </div>
  </div><!-- /#work -->

  <!-- What a long operation is doing. The terminal build puts a bar on the
       screen for exactly as long as the work takes, and `b` sets it going in
       the background rather than cancelling it — the status chip carries on
       from there. -->
  <div id="prog" hidden>
    <div class="sheet">
      <div class="head" id="p-head"></div>
      <div class="body">
        <div id="p-now"></div>
        <div class="bar"><div id="p-fill"></div></div>
        <div id="p-num"></div>
      </div>
      <div class="foot" id="p-foot">Esc = 中止   b = バックグラウンドへ</div>
    </div>
  </div>

  <!-- The confirm. cian's spine is that nothing is lost by a slip, so every
       copy, move and delete goes through here — never a keystroke straight to
       the disk. -->
  <div id="ask" hidden>
    <div class="sheet">
      <div class="head"></div>
      <div class="body"></div>
      <div class="buttons">
        <button data-answer="no">キャンセル  (Esc)</button>
        <button data-answer="yes" class="go">実行  (Enter)</button>
      </div>
    </div>
  </div>
  <!-- The finder. Opens on nothing and fills in while the tree is walked;
       it never waits for the disk before showing itself. -->
  <div id="find" hidden>
    <div class="sheet wide">
      <input class="field" id="find-q" type="text" placeholder="/ で絞り込み">
      <div class="hits" id="find-hits"></div>
      <div class="foot" id="find-foot"></div>
    </div>
  </div>

  <!-- Anything that answers with a list: a search, disk usage, checksums, the
       history. One screen rather than one per question — they differ in what
       Enter does, not in how they look. -->
  <div id="report" hidden>
    <div class="vhead"><span id="r-name"></span><span id="r-about"></span></div>
    <!-- Only for the lists that are long enough to need it — the palette, the
         palettes, the jump list. A hundred and thirty rows walked with j and k
         is not a palette, whatever the help calls it. -->
    <input id="r-q" hidden autocomplete="off" spellcheck="false">
    <div class="hits" id="r-rows"></div>
    <div class="vfoot" id="r-foot"></div>
  </div>

  <!-- The viewer. `Enter` on a file, or F3. Draws a window of lines rather
       than the whole file, the way the terminal build does: a listing of a
       hundred thousand rows is a hundred thousand elements otherwise, and the
       scroll goes to treacle on exactly the files worth opening this way. -->
  <div id="view" hidden>
    <div class="vhead"><span id="v-name"></span><span id="v-about"></span></div>
    <div class="vbody" id="v-body"></div>
    <div class="vpic" id="v-pic" hidden></div>
    <div class="vread" id="v-read" hidden></div>
    <div class="vfoot" id="v-foot"></div>
  </div>

  <!-- The AI chat. A surface, like the viewer: it replaces the listing rather
       than floating over it, so the status and hint bars stay readable —
       every say() from in here used to land on a bar that was covered.

       Its own sheet rather than a bent `#report`, because the shapes differ
       where it matters: a report's input is a *filter* at the top and this
       one is a *turn* at the bottom. Sharing them would mean an `if` in every
       key handler, which is how the two grew apart in the first place. -->
  <div id="chat" hidden>
    <div class="vhead"><span id="c-name"></span><span id="c-about"></span></div>
    <div class="cbody" id="c-body"></div>
    <div class="cfoot">
      <textarea id="c-in" rows="1" autocomplete="off" spellcheck="false"></textarea>
      <div class="chint" id="c-hint"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
