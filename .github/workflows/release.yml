name: release

# Builds the three downloads and publishes them as one GitHub Release.
#
# Trigger it by pushing a version tag (`git tag v1.1.0 && git push --tags`), or
# by hand from the Actions tab. A tag publishes a release; a manual run only
# leaves the packages as workflow artifacts, which is the way to rehearse the
# build without announcing anything.
#
# Each platform job stages a package and uploads it as an artifact. One publish
# job at the end gathers all three, writes the checksums over the finished set,
# and creates the release. That ordering matters: when each job attached its own
# file, three jobs raced to create the same release, and the notes came out
# belonging to whichever finished first.

on:
  push:
    tags:
      # Both spellings: the first releases here were tagged `1.0.0`, with no
      # prefix, and a workflow that only answered to `v*` would sit still while
      # someone waited for it.
      - "v[0-9]*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      everything:
        description: "Build every platform (off: the Windows window only)"
        type: boolean
        default: false

permissions:
  contents: write

# **The Windows window only, unless asked otherwise.**
#
# 2026-09-01: "しばらくは Windows の gui モードでしか動作させないから、ビルドは
# win-gui だけでいいよ". The full set is eleven minutes and a quarter of a
# gigabyte, nearly all of it for platforms nobody is running this week — the
# macOS universal build alone is two compiles of a wgpu front end, and the
# offline source zip is 181MB.
#
# Nothing is deleted. The other jobs are gated on one input: run this workflow
# by hand with **everything = true** and the release is the full set again,
# which is what a version anybody else downloads will need.
jobs:
  # A tag that disagrees with Cargo.toml ships binaries whose `:version` says
  # something other than the release they are attached to. Cheap to check, and
  # the only moment it can still be fixed by moving the tag.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: The tag and Cargo.toml have to agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "tag $tag, Cargo.toml $crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match the workspace version $crate"
            exit 1
          fi

  # The window build for a Mac, as a double-clickable .app. This is the one to
  # download to try `cian` on a real machine; `cian-tui` rides along in the same
  # zip for the terminal.
  macos:
    needs: version
    # **Not gated any more.** The window front end is what he actually uses,
    # and until now the only way to get it onto a Mac was to clone the
    # repository and run `npm start` — which is fine for the person who wrote
    # it and is not a way to hand somebody a program. The heavy half (the
    # the terminal build, the universal package) is still behind
    # `everything`; what always runs is the engine and the window.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Both architectures, because the runner is one of them and half the
      # Macs in the world are the other. An arm64-only bundle on an Intel Mac
      # does not fail to run, it fails to *open*: "このMacには対応していない",
      # with nothing to say which Mac it was built for.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch the bundled font
        run: |
          mkdir -p vendor-font
          curl -sL -o font.zip "$FONT_URL"
          unzip -q font.zip -d font
          cp "$(find font -name 'HackGenConsoleNF-Regular.ttf' | head -1)" vendor-font/cian.ttf
        env:
          FONT_URL: https://github.com/yuru7/HackGen/releases/download/v2.10.0/HackGen_NF_v2.10.0.zip

      # The engine, always: it is what the window in the zip talks to.
      # **Both architectures**, because his Mac is Intel and the runner is
      # not — a single-slice binary does not fail to run on the other one, it
      # fails to *open*, with nothing on screen to say which Mac it was for.
      - name: Build the engine (both architectures)
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target" --bin cian-server
          done

      - name: Build the terminal build
        if: inputs.everything
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target" --bin cian-tui
          done

      # One binary that holds both, where the bundler and the zip expect to
      # find it. `lipo` is what "universal" means: the two builds glued into
      # one file, and macOS picks the slice it can run.
      - name: Make the engine universal
        run: |
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/cian-server \
            target/x86_64-apple-darwin/release/cian-server \
            -output target/release/cian-server
          lipo -info target/release/cian-server

      - name: Make the rest universal
        if: inputs.everything
        run: |
          mkdir -p target/release
          for bin in cian cian-tui; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin" \
              -output "target/release/$bin"
            lipo -info "target/release/$bin"
          done

      - name: Bundle and stage
        if: inputs.everything
        run: |
          ./packaging/macos/bundle.sh
          stage=cian-macos
          mkdir -p "$stage/examples"
          cp -R target/cian.app "$stage/"
          cp target/release/cian-tui target/release/cian-server "$stage/"
          cp examples/init.lua "$stage/examples/"
          cp README.md README.ja.md LICENSE "$stage/"
          # The quarantine catches everyone who downloads this, and cian is
          # not notarised. The fix belongs where they will look for it — in
          # the folder, not on line 30 of a manual.
          cp packaging/macos/README.txt "$stage/"
          # Zipped with ditto so the .app keeps its permissions and the
          # ad-hoc signature survives the round trip.
          ditto -c -k --sequesterRsrc --keepParent "$stage" cian-macos.zip

      - name: Upload artifact
        if: inputs.everything
        uses: actions/upload-artifact@v6
        with:
          name: cian-macos
          path: cian-macos.zip

      # The engine on its own, the same courtesy the Windows job does: the
      # window front end is JavaScript and needs no compiler, so somebody
      # updating it should not have to take a whole package for one file.
      - name: Stage the engine on its own
        run: cp target/release/cian-server cian-server-macos.bin

      - name: Upload the engine
        uses: actions/upload-artifact@v6
        with:
          name: cian-server-macos
          path: cian-server-macos.bin

      # The window front end for macOS — the same contents as the Windows
      # one, with the universal engine beside it. Everything except Electron
      # itself: the front end, its vendored runtime (Monaco, monaco-vim,
      # mermaid, the font), and the engine, which is the first place
      # `engine.js` looks.
      - name: Fetch the editor's runtime
        run: |
          cd gui
          npm install --omit=dev --no-audit --no-fund
          node vendor.js

      - name: Stage the window front end
        run: |
          stage=cian-gui-macos
          mkdir -p "$stage"
          # `rsync` rather than `cp -R`: node_modules is a hundred megabytes
          # of the untrimmed originals that gui/vendor/ already replaces.
          rsync -a --exclude node_modules gui/ "$stage/"
          cp target/release/cian-server "$stage/"
          # **The font, or stop.** `vendor.js` prints a line and carries on
          # when it cannot find one, so a build can quietly ship a package
          # with no face in it and nothing fails. That happened once on the
          # Windows side; it is not going to happen twice.
          test -f "$stage/vendor/fonts/cian.ttf" \
            || { echo "vendor/fonts/cian.ttf is missing — the window would draw the listing in a proportional face"; exit 1; }
          cp packaging/macos/GUI.ja.txt "$stage/"
          cp README.md README.ja.md LICENSE "$stage/"
          mkdir -p "$stage/examples"
          cp examples/init.lua "$stage/examples/"
          ditto -c -k --sequesterRsrc --keepParent "$stage" cian-gui-macos.zip
          ls -lh cian-gui-macos.zip

      - name: Upload the window front end
        uses: actions/upload-artifact@v6
        with:
          name: cian-gui-macos
          path: cian-gui-macos.zip

  windows-x64:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The window build embeds a font so the download needs nothing
      # installed to run. Fetched here rather than committed: it is twelve
      # megabytes that would sit in every clone forever.
      # **Always.** The first gui-only build gated this on `everything` and the
      # window's zip came back 6MB lighter — `gui/vendor.js` copies this same
      # file into `vendor/fonts/cian.ttf`, which is the face the window draws
      # its file-type glyphs with. The window's zip needs it; that one is
      # optional, this is not.
      - name: Fetch the bundled font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor-font | Out-Null
          Invoke-WebRequest -Uri "$env:FONT_URL" -OutFile font.zip
          Expand-Archive font.zip -DestinationPath font
          Copy-Item (Get-ChildItem -Recurse -Filter "HackGenConsoleNF-Regular.ttf" font)[0].FullName vendor-font/cian.ttf
        env:
          FONT_URL: https://github.com/yuru7/HackGen/releases/download/v2.10.0/HackGen_NF_v2.10.0.zip

      # The engine, always: it is what the window in the zip talks to, and it
      # is the fastest of the three to build.
      - name: Build the engine
        run: cargo build --release --bin cian-server

      # `cian-tui` は端末版。窓版の zip には入らないので、全部を頼まれた
      # ときだけ建てる。
      - name: Build the terminal build
        if: inputs.everything
        run: |
          cargo build --release --bin cian-tui

      - name: Stage package
        if: inputs.everything
        shell: pwsh
        run: |
          $stage = "cian-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/cian.exe $stage/
          Copy-Item target/release/cian-tui.exe $stage/
          Copy-Item target/release/cian-server.exe $stage/
          Copy-Item packaging/windows/install.ps1 $stage/
          Copy-Item packaging/windows/README.txt $stage/
          Copy-Item README.md, README.ja.md, LICENSE $stage/
          New-Item -ItemType Directory -Force -Path "$stage/examples" | Out-Null
          Copy-Item examples/init.lua "$stage/examples/"
          Compress-Archive -Path "$stage/*" -DestinationPath "cian-windows-x64.zip" -Force

      - name: Upload artifact
        if: inputs.everything
        uses: actions/upload-artifact@v6
        with:
          name: cian-windows-x64
          path: cian-windows-x64.zip

      # The engine on its own, nine megabytes.
      #
      # The Electron front end is developed in-house against a prebuilt engine
      # — Rust is not installed there and does not need to be, since the front
      # end is JavaScript and the engine changes rarely. Carrying the whole
      # 25MB package for one file that fits on anything is the sort of friction
      # that stops people updating.
      - name: Stage the engine on its own
        shell: pwsh
        run: Copy-Item target/release/cian-server.exe cian-server-win-x64.exe

      - name: Upload the engine
        uses: actions/upload-artifact@v6
        with:
          name: cian-server-win-x64
          path: cian-server-win-x64.exe

      # The window front end, ready to run. cian-windows-x64.zip carries the
      # three exes and nothing of `gui/`, so until now the only way to get the
      # Electron build onto a Windows machine was the 175MB source bundle —
      # for a front end that is JavaScript and needs no compiler at all.
      #
      # Everything except Electron itself: the front end, its vendored runtime
      # (Monaco, monaco-vim, mermaid, the font), and the engine dropped in
      # beside it, which is the first place engine.js looks.
      - name: Fetch the editor's runtime
        run: |
          cd gui
          npm install --omit=dev --no-audit --no-fund
          node vendor.js

      - name: Stage the window front end
        shell: pwsh
        run: |
          $stage = "cian-gui-win-x64"
          # robocopy rather than Copy-Item: -Exclude does not reach into a
          # -Recurse copy, and node_modules is a hundred megabytes of the
          # untrimmed originals that gui/vendor/ already replaces.
          robocopy gui $stage /E /XD node_modules | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }
          $global:LASTEXITCODE = 0
          Copy-Item target/release/cian-server.exe "$stage/"
          Copy-Item packaging/windows/GUI.txt "$stage/"
          # The checklist travels with the zip: the machine this is carried to
          # is offline, so a link to it would be a link to nothing.
          Copy-Item packaging/windows/CHECK.ja.txt "$stage/"
          # How to put this on a shared machine — and the one trap that
          # breaks everybody's bookmarks quietly if it is walked into.
          Copy-Item packaging/windows/DEPLOY.ja.txt "$stage/"
          # The window's own icon. `main.js` looks beside itself first and at
          # the repository root second, so this is what makes the packaged
          # copy find one at all.
          Copy-Item cian.ico, cian.png "$stage/"
          # **The font, or stop.** `vendor.js` prints a line and carries on
          # when it cannot find one, so the first gui-only build shipped a zip
          # 6MB lighter with no face in it and nothing failed. A package that
          # is quietly missing something is worse than a build that stops.
          if (-not (Test-Path "$stage/vendor/fonts/cian.ttf")) {
              throw "vendor/fonts/cian.ttf is missing — the window would draw the listing in a proportional face"
          }
          Copy-Item README.md, README.ja.md, LICENSE "$stage/"
          New-Item -ItemType Directory -Force -Path "$stage/examples" | Out-Null
          Copy-Item examples/init.lua "$stage/examples/"
          Compress-Archive -Path "$stage/*" -DestinationPath "cian-gui-win-x64.zip" -Force
          "{0:N0} MB" -f ((Get-Item cian-gui-win-x64.zip).Length / 1MB)

      - name: Upload the window front end
        uses: actions/upload-artifact@v6
        with:
          name: cian-gui-win-x64
          path: cian-gui-win-x64.zip

  # The whole of cian as one file that builds with no network at all: the
  # source, and every crate it depends on already downloaded. This is what
  # goes in-house, where the point is to change cian rather than to run it.
  #
  # Vendored on Linux although the target is Windows — `cargo vendor` works
  # from Cargo.lock, which lists every platform's crates, so the tree it
  # writes is not the runner's. The job after this one proves that on a real
  # Windows machine rather than trusting it.
  source-offline:
    needs: version
    # Only when asked for — see the note above `jobs:`.
    if: inputs.everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Carried, not fetched. A build behind a company firewall cannot reach
      # GitHub for it, and without it the window build has no font.
      - name: Fetch the bundled font
        run: |
          mkdir -p vendor-font
          curl -sL -o font.zip "$FONT_URL"
          unzip -q font.zip -d font
          cp "$(find font -name 'HackGenConsoleNF-Regular.ttf' | head -1)" vendor-font/cian.ttf
        env:
          FONT_URL: https://github.com/yuru7/HackGen/releases/download/v2.10.0/HackGen_NF_v2.10.0.zip

      # The editor's runtime, for the same reason as the font: a machine behind
      # a company firewall cannot npm install, and without this the GUI opens
      # files into an empty window. `--omit=dev` leaves out Electron itself —
      # a hundred megabytes that is carried separately anyway.
      - name: Fetch the editor's runtime
        run: |
          cd gui
          npm install --omit=dev --no-audit --no-fund
          node vendor.js

      - name: Vendor every dependency
        run: |
          mkdir -p .cargo
          cargo vendor --versioned-dirs vendor > .cargo/config.toml
          echo "vendored crates: $(ls vendor | wc -l)"
          du -sh vendor

      - name: Stage the bundle
        run: |
          stage=cian-source-offline
          mkdir -p "$stage"
          # The tracked tree, exactly — no target/, no .git, nothing local.
          git archive HEAD | tar -x -C "$stage"
          cp -R vendor .cargo "$stage/"
          mkdir -p "$stage/vendor-font"
          cp vendor-font/cian.ttf "$stage/vendor-font/"
          cp -R gui/vendor "$stage/gui/"
          cp packaging/offline/README.txt "$stage/"
          {
            echo "cian $(git describe --tags --always)"
            echo "commit $(git rev-parse HEAD)"
            echo "vendored $(date -u +%Y-%m-%dT%H:%M:%SZ) with $(rustc -V)"
            echo
            echo "Build with this version of Rust or newer."
          } > "$stage/BUILT-WITH.txt"
          zip -qr cian-source-offline.zip "$stage"
          du -sh cian-source-offline.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cian-source-offline
          path: cian-source-offline.zip

  # Does the bundle actually build with nothing but itself? `--offline` makes
  # cargo fail rather than quietly reach crates.io, so a green run here is the
  # claim the package makes, tested on the platform it is for.
  source-offline-check:
    needs: source-offline
    # Only when asked for — see the note above `jobs:`.
    if: inputs.everything
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: cian-source-offline

      - uses: dtolnay/rust-toolchain@stable

      - name: Unpack
        shell: pwsh
        run: Expand-Archive cian-source-offline.zip -DestinationPath .

      - name: Build it with cargo cut off from the network
        shell: pwsh
        working-directory: cian-source-offline
        run: cargo build --release --offline --bin cian-tui --bin cian-server

  # One release, made once, over the finished set of packages.
  publish:
    needs: [macos, windows-x64, source-offline-check]
    # `always()`, because a skipped need would otherwise skip this too, and
    # three of the four are skipped on an ordinary tag now. The one that must
    # have succeeded is named explicitly.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.windows-x64.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # The generated notes are a list of commits, which answers a question
      # nobody arriving here is asking. Seven files with names like
      # cian-source-offline.zip, and no hint which one is the program — the
      # download page has to say which to take before it says what changed.
      #
      # First, and into a subdirectory: checkout cleans what it checks out
      # into, and dist/ is not something to hand it the chance to clean.
      - name: The download guide, above the generated notes
        uses: actions/checkout@v5
        with:
          sparse-checkout: packaging/release-notes.md
          sparse-checkout-cone-mode: false
          path: notes

      - name: Collect the packages
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      # A Windows machine cut off from the network is the one that most needs
      # to know its zip arrived whole. `sha256sum -c SHA256SUMS` on the far
      # side, or `Get-FileHash` on Windows itself.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum cian-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes/packaging/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
