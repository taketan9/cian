name: ci

# Runs on every push and pull request.
#
# The Windows job exists because cian is developed on macOS but shipped for
# Windows: platform-gated code and Cargo features only fail there, and the
# release workflow runs too late to catch it (it is triggered by hand, or by a
# tag, when you already believe the code is good). A `trash` feature that is
# mandatory on Windows once slipped through exactly this gap.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # **Linux は 2026-09-06 に外した**（彼の判断）── cian が配るのは
        # Windows と Mac の2つで、Linux の資材は `everything` の裏にすら
        # 無くなった。
        #
        # **代償を書いておく。** 外す直前まで、Linux でだけ出るものを拾って
        # いたのはこのマトリクスだった（`os.rs` の `properties` が
        # `unused_variables` で3回続けて赤。macOS では絶対に出ない）。
        # `#[cfg(target_os = "linux")]` の枝を触ったら、**それを見る目は
        # もうここに無い**。
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung job used to run until GitHub's six-hour ceiling stopped it, once
    # per push. Every job here finishes in under three minutes when it is
    # healthy, so anything past thirty is stuck and the answer is already known.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The half the Rust jobs above cannot see.
  #
  # **Everything that has actually landed on Taketan's screen broke in the
  # renderer**, and every check the project had ran against the engine: a call
  # to a function that did not exist and a second `refresh()` quietly replacing
  # the first went through `cargo test` and `cargo clippy` untouched. `node
  # --check` would have caught both. It costs seconds and needs nothing
  # installed.
  #
  # `gui/drive.js` — the one that presses real keys at a real window — is not
  # here: it wants a display and an Electron download. It stays a thing you run
  # before pushing (see gui/ROADMAP.ja.md).
  front-end:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse every file the window loads
        run: for f in gui/*.js; do node --check "$f"; done

      - name: The usual audit
        run: python3 scripts/audit.py

      # Is every promise still kept? A failure here is not a lint to be
      # silenced: it means something Taketan asked for has been removed. That
      # happened once — a pane border was built to order and then deleted by a
      # later design pass, with a comment arguing against them — so the check
      # names the request and the date, and the answer is to ask, not to edit.
      - name: The register of requests
        run: python3 scripts/requests.py

      # Do the two front ends still call the same things by the same names?
      # Neither of the checks above can see this: audit.py reads one side at a
      # time and requests.py reads only what was asked for by name. The words
      # had drifted in about thirty places — コピー / コピー（保持）,
      # リネーム / 名前を変える, ゴミファイル検出 / 不要さがし — and every one
      # of them was found by a person using the program.
      - name: The same words in both front ends
        run: python3 scripts/parity.py

      # How much of the window can speak English yet. Not a gate — it is a
      # number that should go up — so it never fails the build; it prints so
      # that a pull request which adds twenty Japanese-only strings says so.
      - name: How far the second language has got
        run: python3 scripts/i18n.py
