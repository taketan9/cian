[package]
name = "cian-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Terminal UI for cian: ratatui rendering, input, layout, popups"

[dependencies]
cian-core = { workspace = true }
cian-lua  = { workspace = true }
cian-pty  = { workspace = true }
cian-scp  = { workspace = true }
cian-ai   = { workspace = true }
ratatui   = { workspace = true }
crossterm = { workspace = true }
anyhow    = { workspace = true }
arboard   = { workspace = true }
toml       = { workspace = true }
serde_yml  = { workspace = true }
serde     = { workspace = true }
serde_json = { workspace = true }
tui-term  = { workspace = true }
image     = { workspace = true }
unicode-width = "0.2"
# Terminal-graphics image preview (kitty / iTerm2 / sixel). Pinned to the 8.x
# line: it targets ratatui 0.29 and is pure Rust (9.x adds a chafa C build
# dependency, which would break the self-contained Windows binary).
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm"] }

[dev-dependencies]
tempfile = "3.27.0"
# `:touch` stamps directories too, which no `File` handle can do. The test
# reads the times back the same way `cian-core::ops` writes them.
filetime = "0.2"
zip = { version = "8", default-features = false, features = ["deflate"] }
