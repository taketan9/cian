[package]
name = "cian"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "cian: a modern two-pane file manager for the terminal"

# The window build is Electron (`gui/`, talking to `cian-server`); the binary
# here says what it is: the same file manager with a terminal under it, for
# ssh, tmux, and every other place a window cannot go.
[[bin]]
name = "cian-tui"
path = "src/main.rs"

[dependencies]
cian-core = { workspace = true }
cian-tui  = { workspace = true }
cian-pty  = { workspace = true }
cian-lua  = { workspace = true }
anyhow    = { workspace = true }

# The icon, stamped into the exe at link time. Windows-only and build-only:
# off Windows this line is not even resolved.
[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }
