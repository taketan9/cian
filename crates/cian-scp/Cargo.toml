[package]
name = "cian-scp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Built-in SFTP file transfer for cian, over pure-Rust russh (no C deps)"

[dependencies]
anyhow = { workspace = true }
# Pure-Rust SSH/SFTP so the single-binary build (and Windows) stay C-dependency
# free. A tiny current-thread tokio runtime drives the async client from cian's
# own worker threads.
russh = "0.62"
russh-sftp = "2.3"
tokio = { version = "1", features = ["rt", "io-util", "net", "macros", "fs"] }
# A download is a copy, so it keeps the server's date. Setting a time by path
# (not through an open handle) is what `filetime` is for — same reason as in
# `cian-core`.
filetime = "0.2"

[dev-dependencies]
# The transfer plans are worked out from a real directory tree, so the tests
# need one to point at.
tempfile = "3.27.0"
