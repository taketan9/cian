[package]
name = "cian-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Domain logic for cian: file operations, marks, history, bookmarks, masks, search"

[features]
# On by default, so every desktop build is unchanged by this existing.
#
# **iOS has no trash.** `trash` targets Windows, macOS and Linux, and there is
# no `NSFileManager trashItemAtURL` on a phone — so a core that always depends
# on it cannot be built for one, and the notes half of cian is exactly what
# ought to travel there. Off, `DeleteMode::Trash` refuses instead of deleting.
#
# Checked the only way it can be from a Mac with no iOS toolchain:
# `cargo build -p cian-core --no-default-features` has to pass.
default = ["desktop"]
desktop = ["dep:trash"]

[dependencies]
serde     = { workspace = true }
serde_json = { workspace = true }
anyhow   = { workspace = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dunce = "1.0.5"
# Text decoding for the viewer (Shift_JIS / UTF-16 …). Pure Rust, the same
# engine Firefox uses; no C dependency, so the Windows build stays clean.
encoding_rs = "0.8"
fs_extra = { workspace = true }
md-5 = { version = "0.11", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false, features = ["alloc"] }
# `coinit_apartmentthreaded` is not optional on Windows: trash fails to compile
# without one of its coinit_* features, and the Shell file APIs it calls want an
# apartment-threaded COM runtime. Default features are otherwise off because the
# `chrono` one only powers trash's listing/restore API, which cian does not use.
trash = { version = "5.2.3", default-features = false, features = ["coinit_apartmentthreaded"], optional = true }
# `aes-crypto` powers password-protected zip creation. The traditional
# ZipCrypto cipher would be openable by Explorer's built-in unzip but is
# cryptographically broken and not exposed by the crate's public API, so AES
# is the only real choice; the UI warns that Explorer cannot open the result.
zip = { version = "8", default-features = false, features = ["deflate", "aes-crypto"] }
# tar + gzip reading, for looking inside .tar / .tar.gz / .tgz. flate2's
# rust_backend (miniz_oxide) keeps this pure-Rust — no C, so the single Windows
# binary still builds without a toolchain.
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Image decoding for the F3 half-block preview. Pure Rust (png/jpeg/gif/… are
# all Rust decoders), so the single-binary/no-C story holds; only the common
# raster formats are enabled to keep the build lean.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
# Free/total space, for the disk-usage column and `:df`. One crate for it,
# not two: `fs2` did the same job here and has not been released since 2019.
fs4 = "1.1.0"
regex = "1.13.1"
unicode-width = "0.2"
# Timestamps on a path, not on an open handle: `File::set_modified` needs the
# thing opened for writing, which rules out directories on Unix and read-only
# files everywhere — and a copy has to carry the source's date onto both.
filetime = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
